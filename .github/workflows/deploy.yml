# GitHub Actions 部署到 Cloudflare Workers
#
# ⚠️ 与 Workers Builds 二选一，不要同时开启，否则每次 push 会重复部署同一个 Worker。
#    Workers Builds 走的是 Cloudflare GitHub App 授权；本方案走 API Token，两条路线互相独立。
#    若 Workers Builds 后来恢复正常并已接线，请删除本文件，或先在 Worker → Settings → Builds
#    里 Disconnect 停用 Workers Builds。
#
# 需要的两个仓库 Secret（Settings → Secrets and variables → Actions → New repository secret）：
#   CLOUDFLARE_API_TOKEN   权限：Account / Workers Scripts / Edit
#   CLOUDFLARE_ACCOUNT_ID  32 位账号 ID，Cloudflare Dashboard 右侧栏可复制
#
# 为什么不跑 `npm ci`：
#   本仓库没有构建步骤，部署只需要一个 wrangler，不需要那棵依赖树。直接跳过安装，
#   管线更快，也不受锁文件状态影响。
#   （package-lock.json 早期缺 @cloudflare/workerd-linux-64、@esbuild/linux-x64 等平台条目，
#   在 Linux runner 上执行 `npm ci` 会装出找不到 workerd 二进制的 wrangler、部署必失败；
#   锁文件已于 2026-10-06 用官方源在干净目录重新解析补全，但保留 npx 方式更省事。）

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 通用 PWA 模块的真源在 shared/pwa-install.js，各项目里的是内联副本。
      # 改了真源却忘记同步，线上就会跑着旧逻辑——这里直接拦下。
      # 修复：本地执行 npm run sync:pwa 后重新提交。
      - name: 校验通用 PWA 模块已同步
        run: node tools/sync-pwa.mjs --check

      # 同理：Supabase 持久化共享模块的真源在 shared/supabase-sync.js。
      - name: 校验 Supabase 共享模块已同步
        run: node tools/sync-supabase.mjs --check

      # 没配 Secret 时给出可读的提示并跳过部署，避免每次 push 都亮红叉
      - name: 预检 Secrets
        id: precheck
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::warning::尚未配置 Secret:$missing —— 本次跳过部署。在 Settings → Secrets and variables → Actions 添加后，重新运行本工作流即可。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Secret 齐备，开始部署。"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.precheck.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
